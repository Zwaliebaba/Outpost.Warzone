name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.configuration }}|${{ matrix.platform }}
    runs-on: windows-latest
    # x64 is an in-flight migration (Docs/X64Readiness.md), not a
    # configuration that is expected to build yet. It runs so its
    # diagnostics are visible and measurable, but it must not fail the
    # workflow or block a PR on Win32 work.
    continue-on-error: ${{ matrix.platform == 'x64' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The compiler resolves includes case-insensitively on Windows, so a
      # wrong filename still builds. This is what catches it.
      - name: Check filename casing
        run: python tools/check_case.py

      # Every file the level list and the load manifests reference must be on
      # disk. A missing asset is otherwise a fatal dialog at runtime, on a
      # Windows box, mid-load.
      - name: Validate asset references
        run: python tools/validate_assets.py

      # MsQuic arrives as a NuGet package. These are packages.config projects,
      # not PackageReference, so this is `nuget install` per project rather
      # than msbuild -t:restore -- and it is done per project rather than for
      # the solution because CI builds the vcxproj directly and Outpost.slnx
      # is the new solution format, which the NuGet CLI does not read.
      # -OutputDirectory must match the ..\packages\ the vcxproj imports.
      - name: Restore NuGet packages
        run: |
          nuget install NeuronCore\packages.config -OutputDirectory packages -NonInteractive
          nuget install Outpost\packages.config -OutputDirectory packages -NonInteractive

      # /flp contains a semicolon, which PowerShell reads as a statement
      # separator unless the whole switch is quoted. Building serially: with
      # /m the failing project's diagnostics can be interleaved away.
      - name: Build
        run: msbuild Outpost\Outpost.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:normal /nologo "/flp:LogFile=build.log;Verbosity=diagnostic"

      # MSBuild can exit non-zero with the failure only in the file log, so
      # surface it rather than leaving the job with no explanation.
      - name: Show failures from build log
        if: failure()
        run: |
          if (Test-Path build.log) {
            Select-String -Path build.log -Pattern 'error |fatal error|Build FAILED|Error\(s\)|LNK' |
              Select-Object -Last 60 | ForEach-Object { $_.Line }
          } else { Write-Host 'no build.log produced' }

      # MSBuild repeats a warning once per referencing project, so the raw
      # count in the build summary overstates them. This reports the
      # deduplicated set, which is the number worth tracking.
      - name: Summarise warnings
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host 'no build.log produced'; exit 0 }
          $root = [regex]::Escape((Get-Location).Path + '\')
          $warnings = Select-String -Path build.log -Pattern ': warning [A-Z]+[0-9]+:' |
            ForEach-Object { $_.Line.Trim() -replace $root, '' -replace ' \[[^\]]*\.vcxproj\]$', '' } |
            Sort-Object -Unique
          $header = "## ${{ matrix.configuration }}|${{ matrix.platform }} - $($warnings.Count) unique warning(s)"
          Write-Host $header
          $header | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($warnings.Count -gt 0) {
            $shown = $warnings | Select-Object -First 200
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $shown | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ($warnings.Count -gt 200) {
              "... and $($warnings.Count - 200) more" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $shown | ForEach-Object { Write-Host $_ }
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.configuration }}-${{ matrix.platform }}
          path: build.log
          if-no-files-found: ignore
