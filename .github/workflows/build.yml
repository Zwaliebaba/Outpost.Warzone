name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  # Builds the real script compiler and runs it over every shipped .slo.
  # A green Windows build only proves the compiler compiles; it cannot
  # notice that the compiler no longer accepts the game's own scripts,
  # which is how `unknown type 'INT'` shipped. Linux because the harness
  # needs nothing but g++.
  scripts:
    name: Script corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile every shipped script
        run: python3 tools/check_scripts.py

  build:
    name: ${{ matrix.configuration }}|${{ matrix.platform }}
    runs-on: windows-latest
    # x64 is an in-flight migration (Docs/X64Readiness.md), not a
    # configuration that is expected to build yet. It runs so its
    # diagnostics are visible and measurable, but it must not fail the
    # workflow or block a PR on Win32 work.
    continue-on-error: ${{ matrix.platform == 'x64' }}
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The compiler resolves includes case-insensitively on Windows, so a
      # wrong filename still builds. This is what catches it.
      - name: Check filename casing
        run: python tools/check_case.py

      # Every file the level list and the load manifests reference must be on
      # disk. A missing asset is otherwise a fatal dialog at runtime, on a
      # Windows box, mid-load.
      - name: Validate asset references
        run: python tools/validate_assets.py

      # MsQuic arrives as a NuGet package. These are packages.config projects,
      # not PackageReference, so this is `nuget install` per project rather
      # than msbuild -t:restore -- and it is done per project rather than for
      # the solution because CI builds the vcxproj directly and Outpost.slnx
      # is the new solution format, which the NuGet CLI does not read.
      # -OutputDirectory must match the ..\packages\ the vcxproj imports.
      - name: Restore NuGet packages
        run: |
          nuget install NeuronCore\packages.config -OutputDirectory packages -NonInteractive
          nuget install Outpost\packages.config -OutputDirectory packages -NonInteractive
          nuget install NeuronCoreTest\packages.config -OutputDirectory packages -NonInteractive
          nuget install NeuronClientTest\packages.config -OutputDirectory packages -NonInteractive
          nuget install NeuronServerTest\packages.config -OutputDirectory packages -NonInteractive

      # /flp contains a semicolon, which PowerShell reads as a statement
      # separator unless the whole switch is quoted. Building serially: with
      # /m the failing project's diagnostics can be interleaved away.
      - name: Build
        run: msbuild Outpost\Outpost.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:normal /nologo "/flp:LogFile=build.log;Verbosity=diagnostic"

      # The unit tests, which until now nothing ran. NeuronCoreTest is not a
      # reference of Outpost -- it compiles the NeuronCore sources it tests
      # directly -- so building the game never built it, and the Json and
      # script compiler/VM suites were dead weight in the tree. They need no
      # GameData and open no files, so building the DLL and handing it to
      # vstest.console is the whole of it.
      - name: Build unit tests
        shell: pwsh
        run: |
          foreach ($proj in 'NeuronCoreTest', 'NeuronClientTest', 'NeuronServerTest') {
            msbuild "$proj\$proj.vcxproj" /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /v:normal /nologo "/flp:LogFile=test-build.log;Verbosity=diagnostic;Append"
            if ($LASTEXITCODE -ne 0) { throw "$proj failed to build" }
          }

      # vstest.console.exe is not on PATH and its location moves with the VS
      # edition the runner image ships, so it is found through vswhere rather
      # than hardcoded. The DLL is globbed for the same reason: neither project
      # sets OutDir, so where it lands is an MSBuild default and not ours to
      # assume.
      - name: Run unit tests
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $vs = & $vswhere -latest -products * -property installationPath
          $vstest = Join-Path $vs 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
          if (-not (Test-Path $vstest)) { throw "vstest.console.exe not found at $vstest" }
          $dlls = foreach ($proj in 'NeuronCoreTest', 'NeuronClientTest', 'NeuronServerTest') {
            $hit = Get-ChildItem -Recurse -Filter "$proj.dll" |
                   Where-Object { $_.FullName -notmatch '\\obj\\' } |
                   Select-Object -First 1
            if (-not $hit) { throw "$proj.dll was not produced" }
            $hit.FullName
          }
          # Win32 is MSBuild's name for the platform; vstest calls it x86.
          $arch = if ('${{ matrix.platform }}' -eq 'x64') { 'x64' } else { 'x86' }
          Write-Host "running as ${arch}:`n$($dlls -join "`n")"
          & $vstest $dlls /Platform:$arch /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed (exit $LASTEXITCODE)" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}-${{ matrix.platform }}
          path: TestResults
          if-no-files-found: ignore

      # MSBuild can exit non-zero with the failure only in the file log, so
      # surface it rather than leaving the job with no explanation.
      - name: Show failures from build log
        if: failure()
        run: |
          foreach ($log in 'build.log', 'test-build.log') {
            if (Test-Path $log) {
              Write-Host "--- $log"
              Select-String -Path $log -Pattern 'error |fatal error|Build FAILED|Error\(s\)|LNK' |
                Select-Object -Last 60 | ForEach-Object { $_.Line }
            } else { Write-Host "no $log produced" }
          }

      # MSBuild repeats a warning once per referencing project, so the raw
      # count in the build summary overstates them. This reports the
      # deduplicated set, which is the number worth tracking.
      - name: Summarise warnings
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { Write-Host 'no build.log produced'; exit 0 }
          $root = [regex]::Escape((Get-Location).Path + '\')
          $warnings = Select-String -Path build.log -Pattern ': warning [A-Z]+[0-9]+:' |
            ForEach-Object { $_.Line.Trim() -replace $root, '' -replace ' \[[^\]]*\.vcxproj\]$', '' } |
            Sort-Object -Unique
          $header = "## ${{ matrix.configuration }}|${{ matrix.platform }} - $($warnings.Count) unique warning(s)"
          Write-Host $header
          $header | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($warnings.Count -gt 0) {
            $shown = $warnings | Select-Object -First 200
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $shown | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ($warnings.Count -gt 200) {
              "... and $($warnings.Count - 200) more" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            }
            '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            $shown | ForEach-Object { Write-Host $_ }
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.configuration }}-${{ matrix.platform }}
          path: build.log
          if-no-files-found: ignore
