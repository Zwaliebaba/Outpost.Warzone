name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.configuration }}|Win32
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # /flp contains a semicolon, which PowerShell reads as a statement
      # separator unless the whole switch is quoted.
      - name: Build
        run: msbuild Outpost\Outpost.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=Win32 /m /v:minimal /nologo "/flp:LogFile=build.log;Verbosity=normal;ErrorsOnly"

      # The tail of a failed build is dominated by the error summary, which
      # omits which translation unit each error came from.
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.configuration }}
          path: build.log
          if-no-files-found: ignore
